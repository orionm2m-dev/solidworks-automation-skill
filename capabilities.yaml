      "limitations": [
        "新增显式 current_saved prepare/apply 模式，固定成功原生 read 的真实 request/result、当前 PID/生命周期/路径/SHA，并再次比较全部已采集状态。",
        "prepare 只返回实际策略及粗/精默认名称/ID；apply 必须显式匹配经复核的实际策略，采用独占一次 marker，仅对一个既有特征调用 RETAIN GOP。prepare 不保存；apply 可显式启用经完整增量验证后的单次保存，不执行 GTP/改策略/改工具。",
        "当前模式仅保护已采集的旧操作/连接/自有工具标量/路径计数和目标几何原始数据；不替代完整 BRep、隐藏夹持几何或 CL 坐标比较。历史 configured-plan 全工具/实体守卫不放宽。",
        "151 项离线 focused+legacy regression PASS；当前 append 模式尚未原生验证。必须先 native prepare 并复核实际catalogue，测试通过不证明默认操作适合加工。",
        "可选 save_after_verified 仅允许 apply；验证 ICWApp.SaveActiveDocument 的确切无参数 HRESULT ABI，沿用已观察 int0 返回；未知返回或部分保存仅保留证据，不重试。",
        "保存后完整捕获两次；只允许文件 SHA 更新和文档 dirty→clean，其余已采集状态必须完全一致。尚无此 current_saved 组合写入与保存的原生成功证明；不证明 reopen 持久性或生产资格。",
        "复用 solidworks_cam_append_mill_operations；不增加工具入口。参见 references/cam-current-saved-append.md。",
        "既有 current_saved endpoint 新增 selected_insert 模式：真实成功保存 receipt + 当前双读取，两个明确无轨迹旧定义 Suppressed=True，复用 InsertOperation 的 Rough0/Finish1 选择插入。",
        "逐步双读取验证，仅允许指定抑制标志和两个新定义；整个批次独占 once marker，事件/身份/代码变化立即停止，不自动重试或回滚。",
        "可复用已验证 Save 序列；无 GOP/GTP、策略/工具赋值或 TechDB 写入。新组合分支尚无原生成功证明。",
        "显式 selected_continue 只承认两次已验证抑制和一次已返回粗加工插入后发生的本地 NC registry 失败；固定原始部分结果与旧 once marker，不重放旧变更。",
        "只读恢复以同一源文件/PID 生命周期和 未保存 CAM 状态双读取（主机 needs_save 标志可为 false，须实际读取并固定）证明唯一已存在粗加工定义与 own NC；apply 仅插入剩余精加工定义，然后可复用 checked Save。",
        "任何变更前检查实际 bridge registry、生成 IID 和 own-NC 精确 getter ABI，包含 ICWNCParam2；离线 integration 覆盖 reused reader→真实 registry 与缺失接口的零变更拒绝。"
      ],
      "allowed_modes": [
        "interactive",
        "reviewed"
      ]
    },
