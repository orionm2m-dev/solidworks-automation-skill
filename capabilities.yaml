      "limitations": ["Pilot: existing MILL feature inventory optionally recovers a returned-but-partially-read EMF through explicit pinned recognition and successful preservation-save receipts. Two fresh complete zero-operation captures verify original context/geometry and feature-only delta; default strict reader unchanged. Programmatic synthetic tests only for this recovery wrapper; no replay, offset resolution, actual WIP, exact spline geometry or production claim.", "Pilot: the existing MILL EMF qualifier accepts optional immutable successful stock-export receipt evidence on exact saved empty304L/MfgView1 raw-stock context. It reuses the export-only unavailable-offset observer and the unchanged delta guard; default readers remain strict. Receipt/native-STL/input-STL hashes are checked at boundaries, no mesh re-export or mode change. Programmatic qualification only until native EMF/MfgView proof; no offsets, actual TURN WIP, physicaldepth or production claim.", "Pilot: solidworks_cam_export_empty_mill_stock native export and represented convex-volume comparison verified on one saved empty304L/MfgView1 copy; offset getter remains unavailable. One receipt-consumed ICWMachine5.CreateSTLOfStock on saved all-visible empty MILL304L, exact STL path/hash/units0/defaultCS/bounds/source. Export-only observer admits len10 strictFalse offset as unavailable, discards all9 outs, and never changes strict stock/AFR readers. Full convex closed-mesh mutual inclusion at fixed0.0001mm, no fitting; mesh comparison does not resolve offset status, actual TURN WIP, AFR gate or production.", "Pilot: solidworks_cam_configure_mill_material has128 staged programmatic tests; MILL native unqualified. Separate empty/all-visible saved MILL scope, exact old/new native name and target-bound mapping, immutable full-inventory prepare and one-use marker. One material setter only; zero operations and unchanged stock/options/geometry/source. No AFR/GOP/GTP/save/TechDB setter or replay; grade name is not delivery/heat-treatment certification or a qualified cutting recipe. TURN writer unchanged.", "Pilot: solidworks_cam_inspect_mill_feature_inventory has 77 staged programmatic tests; native unqualified. Read-only clean saved MILL, zero operations, bounded typed LINE/ARC/CIRCLE contours/islands plus exact native material/stock/EMF defaults; unsupported representations stop. Shared capture guard reused. Declared ICWDoc3.FeatureCreationStyle enum0/1 is pinned;33 focused programmatic checks, native getter still unqualified. Fresh prepare required after this snapshot change. No complete topology, physical-depth or production claim.", "Pilot: solidworks_cam_qualify_mill_feature_recognition has 120 staged programmatic tests; MILL native unqualified. One receipt-consumed Doc3 extraction on an empty saved 304L/stock-first disposable copy; only bounded new features/setups, zero operations, immutable context/source. No GOP/GTP/save/TechDB setter or replay; internal TechDB writes not excluded. Raw qualification stock does not establish actual TURN WIP or S0-to-S2 completion.", "Pilot: explicit circular_pocket qualifier and receipt-pinned single-feature lifecycle are offline tested only. Documented type0/volume2, typed CIRCLE2 or ARC1 complete-circle readback, finite decimal DOUBLE depth; coplanar contours are not depth proof. Default rectangle policy unchanged. Native circle qualification, GOP/GTP/tool/settings/exports support, stock/entry/holder and manufacturing acceptance remain pending.", "Pilot: selected MILL GTP generation_mode=regenerate allows one explicitly prepared ROUGH operation only; exact prior counts, raw ToolDiameterPercent, PID/path/source SHA, immutable prepare receipt and one-use marker. Initial mode unchanged. Captures do not cover all rough parameters; fresh CL/WIP and geometry checks required. No delete/save/automatic retry.", "Pilot: solidworks_cam_configure_mill_rough_boundary exposes one prepared raw tool-diameter percentage setter on an exact disposable ROUGH MILL operation; expected/new finite0..150, exact prior state/receipt, no replay. No GTP, delete, save, export or controller edits. Retained path records after a settings edit are not fresh path proof. Offline checks only until native qualification; physical path and production remain unqualified.", "Pilot: solidworks_cam_inspect_mill_rough_boundary is offline tested only; six typed raw getters for exact generated ROUGH MILL with durable receipt and unchanged PID/source/inventory. No edits, generation, save, export or record access. Native behavior, air-edge mapping, units and contour/production fitness remain unqualified.", "Pilot: solidworks_cam_export_mill_generic_cl native file output verified on one saved disposable single-feature MILL case in2026 SP4: exact S_OK0, 2669bytes, unchanged source/controller/bounded inventory, one generated operation retaining68records, one ungenerated sibling, zero CAM messages and confirmed disconnection. No GTP, simulation, save, controller edit or raw CL-record reads. Export remains review_required; physical units/frame/depth, complete machining and production are not qualified.", "Pilot: solidworks_cam_inspect_mill_operation_levels raw readback verified on one saved disposable MILL case in2026 SP4: depth/flags/origin/ICWUnitVector direction, unchanged complete bounded before/after state and source SHA, zero CAM messages, no mutations. Initial ICWVector mismatch retained as a failed partial probe. Does not qualify units, physical depth, full toolpath or production.", "2026 SP4 独立试件已验证 PID 绑定、加载与机器配置；原生识别3个特征、生成5个车削操作并保存/重开回读", "事件订阅/解除订阅已实测；回调ABI已用内存COM测试，真实CAM消息尚未观察到", "试件仅使用文档允许的默认消息响应，任何消息阻止后续步骤；默认响应不是撤销", "安装、demo=false、机器配置和操作计划不证明 Turning 授权或有效刀路", "CAM更改可能不设置SOLIDWORKS脏标志；保存与重开必须显式验证", "26.10.2026: на сохранённых проверочных копиях подтверждён нативный GTP: наружная M60 — 40 записей, черновая/чистовая кольца — 97/43; остальные операции сохраняются. Подтверждены сохранения и локальная проверка нижнего LOCK в остатке; полная геометрия обработки, реальный инструмент, оснастка и производственный выпуск не подтверждены. Прежний неуспех прямого GTP относится к ранней пробе, а не к текущему состоянию.", "不调用许可证激活或未定义名称的模块检查；不自动处理窗口",
