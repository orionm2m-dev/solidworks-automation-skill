  "backend_catalog": {
    "solidworks-com-pywin32": {
      "language": "Python",
      "runtime": "out_of_process_automation",
      "suitable_for": [
        "短生命周期宏式任务",
        "Automation 兼容接口",
        "可显式构造 VARIANT/SAFEARRAY 的参数"
      ],
      "limitations": [
        "不能调用官方标记为仅进程内非托管 C++ 的指针接口",
        "长期事件回调和复杂 UI 生命周期不作为首选"
      ]
    },
    "solidworks-com-comtypes": {
      "language": "Python",
      "runtime": "out_of_process_automation",
      "suitable_for": [
        "pywin32 封送失败时的独立 COM 封送回退",
        "Pack and Go 等 Automation 接口"
      ],
      "limitations": [
        "不是原生指针接口的替代品",
        "必须重新回读产物，不能把调用成功当作交付成功"
      ]
    },
    "solidworks-csharp-pia": {
      "language": "C#",
      "runtime": "out_of_process_managed",
      "suitable_for": [
        "强类型 PIA 参数",
        "object/out 参数和 SAFEARRAY",
        "Python COM 封送交叉验证"
      ],
      "limitations": [
        "同样不能调用官方标记为仅进程内非托管 C++ 的接口",
        "进程外调用仍受 SolidWorks 主线程和版本行为约束"
      ]
    },
    "solidworks-csharp-addin": {
      "language": "C#",
      "runtime": "in_process_managed_addin",
      "suitable_for": [
        "事件订阅",
        "PropertyManagerPage",
        "TaskPane",
        "长期驻留 UI 回调"
      ],
      "limitations": [
        "需要注册、签名和受信任部署",
        "不替代仅支持非托管 C++ 的指针接口"
      ]
    },
    "solidworks-native-cpp": {
      "language": "C++",
      "runtime": "in_process_unmanaged",
      "suitable_for": [
        "官方限定的进程内 I* 指针接口",
        "大批量底层几何读取",
        "精确原生语义"
      ],
      "limitations": [
        "宿主崩溃风险最高，必须隔离、限定版本并真机回归",
        "不能绕过许可证、缺失加载项或 API 本身缺少的数据"
      ]
    },
    "solidworks-swbasic": {
      "language": "SWBasic/VBA",
      "runtime": "solidworks_main_thread_macro",
      "suitable_for": [
        "切回 SolidWorks 主线程",
        "最小复现和兼容性诊断"
      ],
      "limitations": [
        "不能调用仅支持非托管 C++ 的指针接口",
        "不适合大型可维护执行器"
      ]
    },
    "headless-occt-python": {
      "language": "Python/C++ bindings",
      "runtime": "headless_open_format",
      "suitable_for": [
        "STEP/IGES/BREP/STL 等开放格式",
        "无 SolidWorks 环境的几何构造、检查和预览"
      ],
      "limitations": [
        "不能生成或验证原生 SLDPRT/SLDASM/SLDDRW 特征树语义"
      ]
    },
    "autocad-dotnet": {
      "language": "C#",
      "runtime": "in_process_managed_plugin",
      "suitable_for": [
        "AutoCAD 数据库事务",
        "原生 DWG 写入",
        "ActiveX 代理不稳定时的白名单命令"
      ],
      "limitations": [
        "需要与 AutoCAD 主版本匹配的托管引用和受信任插件部署"
      ]
    },
    "external-solver-python": {
      "language": "Python + solver native executable",
      "runtime": "external_process",
      "suitable_for": [
        "CalculiX/Elmer 输入生成、求解编排和结果审计"
      ],
      "limitations": [
        "需要求解器安装、材料/边界条件证据和工程师复核"
      ]
    },
    "local-python": {
      "language": "Python",
      "runtime": "local_process",
      "suitable_for": [
        "需求规划",
        "证据、DFM、清单和文件审计"
      ],
      "limitations": [
        "不凭文件元数据宣称专有 CAD 特征已经验证"
      ]
    }
